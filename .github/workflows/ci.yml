name: CI

# Two gates:
#
# frontend — the three checks that keep the Vite/TypeScript bundle healthy:
# a strict typecheck, the Vitest unit suite, and a production build. Node 22
# matches the version the repo's nvm setup pins for npm/vite/vitest/tsc.
#
# backend — the full pytest suite under Python 3.12 (matches the `general`
# conda env used locally), installed from requirements.txt. pytest.ini
# supplies the run flags (-n 8 via pytest-xdist, short tracebacks).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't queue
# behind a stale build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build (Vite)
        run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/
