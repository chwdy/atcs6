name: CI

# Frontend build-pipeline gate (longterm_todo.md item #7). Runs the three
# checks that keep the Vite/TypeScript bundle healthy: a strict typecheck, the
# Vitest unit suite, and a production build. Node 22 matches the version the
# repo's nvm setup pins for npm/vite/vitest/tsc.
#
# The Python backend suite is not run here yet: its dependencies live in the
# `general` conda env and the repo has no pip-installable requirements manifest.
# Add a second job once one exists.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't queue
# behind a stale build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build (Vite)
        run: npm run build
