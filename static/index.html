<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Control System</title>
    <!-- Theme pre-paint stub — the only theme code that must run before the
         stylesheets apply, so there is no flash of the wrong theme. It sets the
         two independent theme axes from saved preference:
           data-theme        (editor chrome) — saved, else dark
           data-canvas-theme  (layout canvas) — saved, else dark
         Everything else — switching, persistence, the registries, the redraw
         on canvas change — lives in the typed ThemeManager
         (frontend/src/lib/theme.ts), which reconciles these once the bundle
         loads. Shares its contract: the 'atcs6-theme' / 'atcs6-canvas-theme'
         storage keys and the defaults above. A saved name is passed through
         as-is so new themes work here without editing this stub; the manager
         corrects unknown values. -->
    <script>
      (function () {
        var el = document.documentElement;
        function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        el.setAttribute('data-theme', read('atcs6-theme') || 'dark');
        el.setAttribute('data-canvas-theme', read('atcs6-canvas-theme') || 'dark');
      })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/static/vendor/tabler/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div id="fatal-banner" class="fatal-banner" hidden role="alert" aria-live="assertive">
            <i class="ti ti-alert-octagon-filled fatal-banner-icon" aria-hidden="true"></i>
            <div class="fatal-banner-body">
                <div class="fatal-banner-title">Halted — hardware failure</div>
                <div class="fatal-banner-detail" id="fatal-banner-detail"></div>
                <div class="fatal-banner-meta" id="fatal-banner-meta"></div>
            </div>
            <button id="btn-activate-fatal" class="btn fatal-banner-btn" type="button">Activate</button>
            <button id="btn-restart-fatal" class="btn fatal-banner-btn" type="button">Restart Server</button>
        </div>

        <div class="app-body">
            <div class="content-area">
                <div class="workspace">
                    <!-- Today's entity panels draw their title, back link and
                         body into these three nodes. The Editor screen's right
                         panel moves them into itself while it shows
                         (frontend/src/next/editor/legacy-panel.ts); on the other
                         screens they wait here, never shown. The `visible`
                         class on this element says whether a panel is open. -->
                    <div class="panel-holder" id="secondary-sidebar" hidden>
                        <button class="secondary-nav-btn secondary-nav-parent" id="secondary-nav-parent" hidden></button>
                        <h3 id="secondary-sidebar-title">Editor</h3>
                        <div class="secondary-sidebar-content" id="secondary-sidebar-content"></div>
                    </div>

                    <div class="canvas-container">
                        <!--
                          Phase 5: world canvas (static / map-shape layer) sits
                          below; live canvas (trains, hover,
                          selection) sits on top. The live canvas keeps the
                          legacy #rail-canvas id so existing JS that reads
                          mouse events / bounding rect off that element still
                          works (mouse events fire on the topmost canvas).
                        -->
                        <canvas id="rail-world-canvas"></canvas>
                        <canvas id="rail-canvas"></canvas>
                        <div class="canvas-overlay">
                            <div class="canvas-view-controls">
                                <button type="button" class="canvas-view-btn" id="btn-zoom-out" title="Zoom out">−</button>
                                <button type="button" class="canvas-view-btn" id="btn-zoom-reset" title="Reset to 100% and fit">1:1</button>
                                <button type="button" class="canvas-view-btn" id="btn-zoom-in" title="Zoom in">+</button>
                                <span class="canvas-view-sep" aria-hidden="true"></span>
                                <button type="button" class="canvas-view-btn" id="btn-fit-view" title="Fit all tracks in view">Fit</button>
                            </div>
                            <div class="status-bar">
                                <span id="status-coords">0, 0</span>
                                <span id="status-zoom">100%</span>
                                <span id="status-state">Ready</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Save Layout Modal -->
    <div id="save-layout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Save Layout</h3>
                <button class="close-btn" data-close-modal>&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="layout-name">Layout Name</label>
                    <input type="text" id="layout-name" placeholder="Enter layout name..." />
                </div>
                <div class="form-group">
                    <label for="layout-description">Description (optional)</label>
                    <textarea id="layout-description" placeholder="Enter description..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Or overwrite existing layout:</label>
                    <div id="save-layouts-list" class="layouts-list layouts-list-compact">
                        <p class="loading-text">Loading...</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal>Cancel</button>
                <button class="btn btn-primary" id="btn-confirm-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Load Layout Modal -->
    <div id="load-layout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Load Layout</h3>
                <button class="close-btn" data-close-modal>&times;</button>
            </div>
            <div class="modal-body">
                <div id="layouts-list" class="layouts-list">
                    <p class="loading-text">Loading layouts...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal>Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal — opened from the top bar's gear menu. Hosts the Display
         settings (label spacing, model scale) and the Advanced runtime numbers.
         The map's layers are in the top bar's View menu (lib/canvas-layers.ts). -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="close-btn" data-close-modal>&times;</button>
            </div>
            <div class="modal-body">
                <section class="settings-section">
                    <h4 class="settings-section-title">Display</h4>
                    <div class="settings-controls">
                        <div class="setting-row">
                            <span class="setting-label-compact settings-label-inline">Labels</span>
                            <select id="label-spacing-select" class="setting-select setting-input-compact settings-select-fill">
                                <option value="tight">Tight</option>
                                <option value="mid" selected>Mid</option>
                                <option value="cozy">Cozy</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="settings-section">
                    <h4 class="settings-section-title">Advanced</h4>
                    <div id="advanced-settings-controls" class="settings-controls advanced-settings-controls">
                        <span class="setting-label-compact">Loading…</span>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Frontend build bundle (longterm_todo.md item #7, complete). Built by
         Vite from frontend/src/main.ts into static/dist/main.js — the single
         script for the whole app. Every classic script (app.js, editor.js, the
         renderer/panel/foundation cluster) has migrated into this bundle.
         Regenerate with `npm run build`. -->
    <script type="module" src="dist/main.js"></script>
</body>
</html>
