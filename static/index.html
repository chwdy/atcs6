<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Control System</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="icon">🚅</span>
                <h1>Rail</h1>
            </div>
            <div class="controls">
                <div class="simulation-controls">
                    <button id="btn-play-pause" class="btn btn-primary" title="Start/Pause Simulation">
                        <span class="icon">▶</span> Play
                    </button>
                    <button id="btn-reset" class="btn btn-danger" title="Reset Simulation">
                        <span class="icon">↺</span>
                    </button>
                    <div class="speed-presets">
                        <button class="btn btn-sm speed-btn" data-speed="0.5">0.5x</button>
                        <button class="btn btn-sm speed-btn active" data-speed="1">1x</button>
                        <button class="btn btn-sm speed-btn" data-speed="2">2x</button>
                        <button class="btn btn-sm speed-btn" data-speed="3">3x</button>
                    </div>
                </div>
                <div class="mode-switch">
                    <button id="mode-edit" class="btn btn-size-tight active">Editor</button>
                    <button id="mode-sim" class="btn btn-size-tight">Simulation</button>
                </div>
                <div class="layout-controls">
                    <button id="btn-new-layout" class="btn btn-outline" title="New Layout">📄 New</button>
                    <button id="btn-save-layout" class="btn btn-outline" title="Save Layout">💾 Save</button>
                    <button id="btn-load-layout" class="btn btn-outline" title="Load Layout">📂 Load</button>
                </div>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <div class="sidebar-tools-section" id="tools-panel">
                    <h3>Tools</h3>
                    
                    <!-- Row 1: General -->
                    <div class="tool-category">
                        <div class="tool-category-label">General</div>
                        <div class="tool-row">
                            <button class="tool-btn active" data-tool="select" title="Select">
                                <span class="tool-icon">↖</span> Select
                            </button>
                            <button class="tool-btn" data-tool="eraser" title="Eraser">
                                <span class="tool-icon">⌫</span> Eraser
                            </button>
                        </div>
                    </div>

                    <!-- Row 2: Track -->
                    <div class="tool-category">
                        <div class="tool-category-label">Track</div>
                        <div class="tool-row">
                            <button class="tool-btn" data-tool="track" title="Track">
                                <span class="tool-icon">═</span> Track
                            </button>
                            <button class="tool-btn" data-tool="signal" title="Signal">
                                <span class="tool-icon">🚦</span> Signal
                            </button>
                        </div>
                    </div>

                    <!-- Row 3: Platform -->
                    <div class="tool-category">
                        <div class="tool-category-label">Platform</div>
                        <div class="tool-row">
                            <button class="tool-btn" data-tool="platform" title="Platform">
                                <span class="tool-icon">🚉</span> Platform
                            </button>
                            <button class="tool-btn" data-tool="extend-platform" title="Extend Existing Platform">
                                <span class="tool-icon">🚉+</span> Extend
                            </button>
                            <button class="tool-btn" data-tool="remove-platform-tile" title="Remove Platform Tile">
                                <span class="tool-icon">➖🚉</span> Remove
                            </button>
                            <button class="tool-btn" data-tool="stations-panel" title="Logical Station Groups">
                                <span class="tool-icon">🏛️</span> Stations
                            </button>
                        </div>
                    </div>

                    <!-- Row 4: Block -->
                    <div class="tool-category">
                        <div class="tool-category-label">Block</div>
                        <div class="tool-row">
                            <button class="tool-btn" data-tool="block" title="Create New Block">
                                <span class="tool-icon">▣</span> Block
                            </button>
                            <button class="tool-btn" data-tool="extend-block" title="Extend Existing Block">
                                <span class="tool-icon">▣+</span> Extend
                            </button>
                            <button class="tool-btn" data-tool="remove-block-tile" title="Remove Block Tile">
                                <span class="tool-icon">➖▣</span> Remove
                            </button>
                        </div>
                    </div>

                    <!-- Row 5: Dispatch -->
                    <div class="tool-category">
                        <div class="tool-category-label">Dispatch</div>
                        <div class="tool-row">
                            <button class="tool-btn" data-tool="path" title="Create Path Between Blocks">
                                <span class="tool-icon">🛤️</span> Path
                            </button>
                            <button class="tool-btn" data-tool="extend-path" title="Extend Existing Path">
                                <span class="tool-icon">🛤️+</span> Extend
                            </button>
                            <button class="tool-btn" data-tool="cancel-path" title="Cancel Path">
                                <span class="tool-icon">🛤️✕</span> Cancel
                            </button>
                            <button class="tool-btn" data-tool="paths-panel" title="View Active Paths">
                                <span class="tool-icon">📋</span> Paths
                            </button>
                        </div>
                    </div>

                    <!-- Row 6: Train -->
                    <div class="tool-category">
                        <div class="tool-category-label">Train</div>
                        <div class="tool-row">
                            <button class="tool-btn" data-tool="add-train" title="Add New Train">
                                <span class="tool-icon">🚂</span> Add
                            </button>
                            <button class="tool-btn" data-tool="train-panel" title="Train Management">
                                <span class="tool-icon">📋</span> Trains
                            </button>
                            <button class="tool-btn" data-tool="routes-panel" title="Train Route Editor">
                                <span class="tool-icon">🛤️</span> Train Routes
                            </button>
                            <button class="tool-btn" data-tool="schedules-panel" title="View Schedules">
                                <span class="tool-icon">📅</span> Schedules
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar-content-section">
                    <div class="sidebar-section properties-panel" id="properties-panel">
                        <h3>Properties</h3>
                        <p class="properties-empty">Select an element to view properties</p>
                    </div>

                    <div class="sidebar-section debug-panel collapsible-sidebar-section collapsed" id="debug-panel" data-section="debug">
                        <button class="sidebar-section-toggle" type="button" aria-expanded="false" aria-controls="debug-panel-body">
                            <h3>Debug Info</h3>
                        </button>
                        <div class="sidebar-section-body" id="debug-panel-body">
                            <div class="debug-controls">
                            <label title="Show Track Bits">
                                <input type="checkbox" id="debug-show-bits" />
                                <span>Track Bits</span>
                            </label>
                            <label title="Show Coordinates">
                                <input type="checkbox" id="debug-show-coords" />
                                <span>Coordinates</span>
                            </label>
                            <label title="Show Switch States">
                                <input type="checkbox" id="debug-show-switches" />
                                <span>Switch States</span>
                            </label>
                            <label title="Show Edge Labels (N/E/S/W)">
                                <input type="checkbox" id="debug-show-edges" />
                                <span>Edge Labels</span>
                            </label>
                            <label title="Show Block Details">
                                <input type="checkbox" id="debug-show-blocks" />
                                <span>Blocks</span>
                            </label>
                            <label title="Show Signal Details">
                                <input type="checkbox" id="debug-show-signals" />
                                <span>Signals</span>
                            </label>

                            <label title="Show Train Position Details" class="debug-control-span-2">
                                <input type="checkbox" id="debug-show-train-position" checked />
                                <span>Show Train Position Details</span>
                            </label>

                            </div>
                        
                            <!-- Train Position Debug Panel is now in secondary sidebar -->
                        </div>

                    </div>

                    <div class="sidebar-section settings-panel collapsible-sidebar-section collapsed" id="settings-panel" data-section="settings">
                        <button class="sidebar-section-toggle" type="button" aria-expanded="false" aria-controls="settings-panel-body">
                            <h3>Settings</h3>
                        </button>
                        <div class="sidebar-section-body" id="settings-panel-body">
                            <div class="settings-controls">
                            <div class="setting-row">
                                <span class="setting-label-compact settings-label-inline">Labels</span>
                                <select id="label-spacing-select" class="setting-select setting-input-compact settings-select-fill">
                                    <option value="tight">Tight</option>
                                    <option value="mid" selected>Mid</option>
                                    <option value="cozy">Cozy</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <span id="scale-current-display" class="setting-label-compact settings-label-inline">Current: 1:1</span>
                                <select id="scale-select" class="setting-select setting-input-compact settings-select-fill">
                                    <option value="1">1:1 (Full)</option>
                                    <option value="22.5">1:22.5 (G)</option>
                                    <option value="43.5">1:43.5 (O)</option>
                                    <option value="64">1:64 (S)</option>
                                    <option value="87">1:87 (HO)</option>
                                    <option value="120">1:120 (TT)</option>
                                    <option value="148">1:148 (N UK)</option>
                                    <option value="160">1:160 (N)</option>
                                    <option value="220">1:220 (Z)</option>
                                </select>
                                <button id="scale-apply-custom" class="btn btn-sm btn-secondary">Set</button>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <div class="content-area">
                <div class="workspace">
                    <!-- Secondary sidebar for editors (block, signal details) - positioned to the right of main sidebar -->
                    <aside class="secondary-sidebar" id="secondary-sidebar">
                        <div class="secondary-sidebar-header">
                            <div class="secondary-sidebar-nav">
                                <button class="secondary-nav-btn" id="secondary-nav-back" title="Back" aria-label="Go back">←</button>
                                <button class="secondary-nav-btn" id="secondary-nav-forward" title="Forward" aria-label="Go forward">→</button>
                                <button class="secondary-nav-btn" id="secondary-nav-pin" title="Pin inspector" aria-label="Pin inspector">📌</button>
                            </div>
                            <h3 id="secondary-sidebar-title">Editor</h3>
                            <button class="close-btn" id="close-secondary-sidebar" title="Close">×</button>
                        </div>
                        <div class="secondary-sidebar-tabs" id="secondary-sidebar-tabs"></div>
                        <div class="secondary-sidebar-breadcrumb" id="secondary-sidebar-breadcrumb"></div>
                        <div class="secondary-sidebar-content" id="secondary-sidebar-content">
                            <!-- Dynamic content will be injected here -->
                        </div>
                    </aside>

                    <div class="canvas-container">
                        <canvas id="rail-canvas"></canvas>
                        <div class="canvas-overlay">
                            <div class="status-bar">
                                <span id="status-coords">0, 0</span>
                                <span id="status-zoom">100%</span>
                                <span id="status-state">Ready</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Train Monitor Bar (bottom of screen, visible when train selected) -->
                <div id="train-monitor-bar" class="train-monitor-bar hidden">
                    <div class="train-monitor-header">
                        <span class="train-monitor-title" id="train-monitor-title">Train Monitor</span>
                        
                        <div class="view-distance-controls">
                            <button class="view-dist-btn" data-distance="100">1m</button>
                            <button class="view-dist-btn active" data-distance="500">5m</button>
                            <button class="view-dist-btn" data-distance="1000">10m</button>
                            <button class="view-dist-btn" data-distance="0">All</button>
                            <button class="view-lookahead-btn text-primary" id="view-lookahead-btn" title="View raw lookahead data">📋 JSON</button>
                        </div>
                        
                        <button class="train-monitor-close" id="train-monitor-close" title="Close">×</button>
                    </div>
                    <div class="train-monitor-content">
                        <div class="train-monitor-info" id="train-monitor-info">
                            <div class="train-speed-display">
                                <span class="speed-value" id="monitor-current-speed">0</span>
                                <span class="speed-unit">km/h</span>
                            </div>
                            <div class="train-target-speed">
                                <span class="label">Target:</span>
                                <span class="value" id="monitor-target-speed">0</span>
                                <span class="unit">km/h</span>
                            </div>
                            <div class="train-debug-info text-xs mt-2">
                                <span class="debug-label">Speed:</span>
                                <span class="debug-value" id="monitor-speed-cms">0</span>
                                <span class="debug-unit">cm/s</span>
                            </div>
                            <div class="train-debug-info text-xs mt-1">
                                <span class="debug-label">Clearance:</span>
                                <span class="debug-value" id="monitor-clearance">0</span>
                                <span class="debug-unit">m</span>
                            </div>
                            <div class="train-debug-info text-xs mt-1 hidden" id="monitor-next-dest-container">
                                <span class="debug-label">Next Stop:</span>
                                <span class="debug-value" id="monitor-next-dest-dist">0</span>
                                <span class="debug-unit">m</span>
                            </div>
                            <div class="train-speed-limit-reason text-xs mt-2 hidden" id="monitor-speed-limit-reason"></div>
                            <div class="train-wait-reason text-xs text-secondary mt-2 hidden" id="monitor-wait-reason"></div>
                        </div>
                        <canvas id="train-monitor-canvas" class="train-monitor-canvas"></canvas>
                        <div class="train-monitor-resizer" id="train-monitor-resizer" aria-hidden="true"></div>
                        <div class="train-monitor-upcoming" id="monitor-upcoming-container">
                            <div class="upcoming-header">Upcoming</div>
                            <div class="upcoming-list" id="monitor-upcoming"></div>
                        </div>
                        <!-- Expanded Debug Info Panel (appended dynamically) -->
                        <div id="train-monitor-debug-container" class="train-monitor-debug-container hidden">
                            <div class="debug-header">Debug Details</div>
                            <div id="train-monitor-debug-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="js/constants.js?v=15"></script>
    <script src="js/api.js?v=15"></script>
    <script src="js/state-manager.js?v=15"></script>
    <script src="js/helpers.js?v=15"></script>
    <script src="js/pathfinders.js?v=15"></script>
    <script src="js/renderer-tracks.js?v=15"></script>
    <script src="js/renderer-signals.js?v=15"></script>
    <script src="js/renderer-platforms.js?v=16"></script>
    <script src="js/renderer-blocks.js?v=15"></script>
    <script src="js/renderer-debug.js?v=15"></script>
    <script src="js/renderer-routes.js?v=15"></script>
    <script src="js/renderer-trains.js?v=15"></script>
    <script src="js/renderer.js?v=15"></script>
    <script src="js/editor-blocks.js?v=15"></script>
    <script src="js/editor-stations.js?v=15"></script>
    <script src="js/editor-signals.js?v=15"></script>
    <script src="js/editor-switches.js?v=15"></script>
    <script src="js/editor-trains.js?v=15"></script>
    <script src="js/editor-paths.js?v=15"></script>
    <script src="js/editor-routes.js?v=16"></script>
    <script src="js/editor-ui.js?v=15"></script>
    <script src="js/editor.js?v=16"></script>
    <script src="js/train-monitor.js?v=15"></script>
    <script src="js/app.js?v=15"></script>
</body>
</html>
