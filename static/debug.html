<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Inspector</title>
    <link rel="stylesheet" href="css/debug.css">
</head>
<body>
    <header class="debug-header">
        <h1>Debug Inspector</h1>
        <div class="header-controls">
            <label class="toggle-label">
                <input type="checkbox" id="auto-refresh"> Auto-refresh (2s)
            </label>
            <span id="status-indicator" class="status-dot status-off"></span>
        </div>
    </header>

    <section class="path-bar">
        <span class="path-label">Path:</span>
        <input type="text" id="path-input" placeholder="network.trains.T1" spellcheck="false">
        <button id="path-go" title="Navigate">Go</button>
        <button id="path-up" title="Go up one level">Up</button>
    </section>

    <section id="summary-panel" class="panel">
        <h2>Summary</h2>
        <div id="summary-content" class="summary-grid">Loading...</div>
    </section>

    <section class="panel tree-panel">
        <h2>Object Tree</h2>
        <div id="tree-container" class="tree"></div>
    </section>

    <section class="panel">
        <h2>Block History <span id="history-count" class="badge"></span></h2>
        <div id="history-container" class="history-list"></div>
    </section>

    <!-- Debug inspector logic, migrated from static/js/debug-inspector.js to
         frontend/src/debug/debug-inspector.ts and bundled by Vite into
         static/dist/debug.js (longterm_todo.md item #7). Regenerate with
         `npm run build`. -->
    <script type="module" src="dist/debug.js"></script>
</body>
</html>
